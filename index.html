<!doctype html>
<html lang="en">
  <head>
    <title>UTM Thrive</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
  </head>
  <body>
    <div id="map"></div>
    <div id="center-pin">
      <img
        src="https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png"
        alt="pin"
      />
    </div>

    <div class="ui">
      <div class="search">
        <div id="find-bar" class="search-bar">
          <div id="gps-icon">𖦏</div>
          <div class="input">
            <div id="find-hint"></div>
            <input
              type="text"
              id="search-from"
              class="search-text"
              placeholder="Find your starting point"
              autocomplete="off"
            />
          </div>
          <div class="action">
            <button id="clears" class="clear">✕</button>
            <div id="find-icon" class="search-icon">
              <svg viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="22" y1="22" x2="19" y2="19"></line>
              </svg>
            </div>
          </div>
        </div>

        <div id="suggestions"></div>

        <div id="search-bar" class="search-bar">
          <svg viewBox="0 0 24 24">
            <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path>
            <circle cx="12" cy="10" r="3"></circle>
          </svg>
          <div class="input">
            <div id="search-hint"></div>
            <input
              type="text"
              id="search-to"
              class="search-text"
              placeholder="Search your destination"
              autocomplete="off"
            />
          </div>
          <div class="action">
            <button id="clear" class="clear">✕</button>
            <div id="search-icon" class="search-icon">
              <svg viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="22" y1="22" x2="19" y2="19"></line>
              </svg>
            </div>
          </div>
        </div>

        <button id="confirm">Confirm destination</button>
      </div>
    </div>
    <script>
      const Utils = {
        escapeRegex: (str) => str.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"),
        debounce: (func, delay = 200) => {
          let timeoutId;
          return (...args) => {
            clearTimeout(timeoutId);
            timeoutId = setTimeout(() => func.apply(this, args), delay);
          };
        },
      };

      class MapApp {
        constructor() {
          this.destination;
          this.from;
          this.telegram;
          this.state = {
            buildingsData: [],
            activeAutofillValue: "",
            currentMarker: null,
            isSelection: false,
          };
          this.ui = {
            clearBtn: document.getElementById("clear"),
            confirmBtn: document.getElementById("confirm"),
            centerPin: document.getElementById("center-pin"),
            searchBar: document.getElementById("search-bar"),
            searchInput: document.getElementById("search-to"),
            searchIcon: document.getElementById("search-icon"),
            searchHint: document.getElementById("search-hint"),
            dropdownMenu: document.getElementById("suggestions"),
            findBar: document.getElementById("find-bar"),
          };
          this.config = {
            defaultCenter: [1.56, 103.638],
            defaultZoom: 16,
            maxZoom: 18,
          };
        }
        async init() {
          this.fixLeafletIcons();
          this.initMap();
          this.bindEvents();
          await this.loadData();
          this.expandTelegram();
        }

        fixLeafletIcons() {
          delete L.Icon.Default.prototype._getIconUrl;
          L.Icon.Default.mergeOptions({
            iconRetinaUrl:
              "https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon-2x.png",
            iconUrl:
              "https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png",
            shadowUrl:
              "https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png",
          });
        }

        initMap() {
          this.map = L.map("map", { zoomControl: false }).setView(
            this.config.defaultCenter,
            this.config.defaultZoom,
          );

          this.config.maxZoom = this.map.getMaxZoom() || 18;
          this.map.attributionControl.setPosition("bottomleft");
          this.map.attributionControl.setPrefix(false);

          L.tileLayer(
            "https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",
            {
              attribution: "© <a href='#' id='attribution'>UTM Confession</a>",
            },
          ).addTo(this.map);
          document
            .getElementById("attribution")
            .addEventListener("click", (e) => {
              e.preventDefault();
              const url = "https://t.me/utmconfession";
              if (window.Telegram?.WebApp) {
                window.Telegram.WebApp.openTelegramLink(url);
              } else {
                window.open(url, "_blank");
              }
            });
        }

        async loadData() {
          this.ui.searchInput.disabled = true;
          this.ui.searchInput.placeholder = "Loading map data...";
          try {
            const response = await fetch("./buildings.json");
            this.state.buildingsData = await response.json();

            this.ui.searchInput.disabled = false;
            this.ui.searchInput.placeholder = "Search your destination";
          } catch (error) {
            console.error("Error loading building data:", error);
            this.ui.searchInput.placeholder = "Error loading data";
          }
        }
        bindEvents() {
          this.map.on("click", (e) => this.handleMapClick(e));
          this.map.on("dragstart", () => this.handleMapDragStart());
          this.map.on("moveend", () => this.handleMapMoveEnd());
          this.ui.searchInput.addEventListener(
            "input",
            Utils.debounce((e) => this.handleSearchInput(e.target.value), 200),
          );
          this.ui.searchInput.addEventListener("keydown", (e) =>
            this.handleKeydown(e),
          );
          this.ui.clearBtn.addEventListener("click", () => this.clearSearch());
          this.ui.confirmBtn.addEventListener("click", () =>
            this.confirmDestination(),
          );
        }

        setPin(loc) {
          if (this.state.currentMarker) {
            this.state.currentMarker.setLatLng(loc).addTo(this.map);
          } else {
            this.state.currentMarker = L.marker(loc).addTo(this.map);
          }
          this.ui.centerPin.classList.remove("show", "animating");
        }

        resetSearchUI() {
          this.ui.dropdownMenu.classList.remove("show");
          this.ui.searchHint.textContent = "";
          this.state.activeAutofillValue = "";
        }

        handleMapClick(e) {
          this.map.setView(e.latlng, this.config.maxZoom);
          this.setPin(e.latlng);
        }

        handleMapDragStart() {
          if (this.state.currentMarker) {
            this.map.removeLayer(this.state.currentMarker);
            this.ui.centerPin.classList.add("show", "animating");
          }
          this.resetSearchUI();
        }

        handleMapMoveEnd() {
          if (this.state.isSelection) {
            this.state.isSelection = false;
          } else if (
            this.state.currentMarker &&
            this.ui.centerPin.classList.contains("show")
          ) {
            this.setPin(this.map.getCenter());
            this.ui.searchInput.placeholder = "Name this location";
            this.ui.confirmBtn.innerText = "Suggest name";
            this.ui.searchInput.style.cursor = "default";
            this.ui.searchInput.disabled = false;
            this.ui.searchInput.value = "";
            this.ui.searchIcon.classList.add("hide");
            this.ui.clearBtn.classList.add("show");
            this.ui.confirmBtn.classList.add("show");
          }
        }

        handleKeydown(e) {
          if (e.key === "Tab" && this.state.activeAutofillValue) {
            e.preventDefault();
            this.ui.searchInput.value = this.state.activeAutofillValue;
            this.ui.searchHint.textContent = "";
            this.handleSearchInput(this.ui.searchInput.value);
          }
        }

        clearSearch() {
          this.resetSearchUI();
          this.state.isSelection = false;
          this.ui.searchInput.value = "";
          this.ui.searchInput.disabled = false;
          this.ui.searchInput.placeholder = "Search your destination";

          if (this.state.currentMarker) {
            this.map.removeLayer(this.state.currentMarker);
            this.state.currentMarker = null;
          }

          this.ui.clearBtn.classList.remove("show");
          this.ui.searchIcon.classList.remove("hide");
          this.ui.confirmBtn.classList.remove("show");
          this.ui.findBar.classList.remove("show");

          setTimeout(() => {
            this.ui.confirmBtn.innerText = "Confirm destination";
          }, 400);
        }

        confirmDestination() {
          if (this.ui.searchInput.value === "") {
            this.ui.searchBar.classList.add("error");
            this.ui.searchInput.classList.add("error");

            setTimeout(() => {
              this.ui.searchBar.classList.remove("error");
              this.ui.searchInput.classList.remove("error");
            }, 400);

            this.ui.searchInput.focus();
          } else {
            this.destination = {
              name: this.ui.searchInput.value,
              lat: location.lat,
              lng: location.lng,
            };

            this.ui.confirmBtn.innerHTML = `
            <svg viewBox="0 0 24 24">
              <polygon points="12 13 5 12 19 5 14 19"></polygon>
            </svg>
            </span>Use my current location</span>`;
            this.ui.searchInput.disabled = true;
            this.ui.findBar.classList.add("show");
          }
          // if (this.telegram) {
          //   const location = this.map.getCenter();
          //   this.telegram.sendData(
          //     JSON.stringify({
          //       // name: this.ui.searchInput.value,
          //       lat: location.lat,
          //       lng: location.lng,
          //     }),
          //   );
          // }
        }

        handleSearchInput(value) {
          const normalizedValue = value.trim().toLowerCase();
          this.ui.searchIcon.classList.add("hide");
          this.ui.clearBtn.classList.add("show");
          this.ui.dropdownMenu.innerHTML = "";

          if (!this.state.currentMarker || this.state.isSelection) {
            const searchRegex = new RegExp(
              `\\b${Utils.escapeRegex(normalizedValue)}`,
              "i",
            );

            const filtered = this.state.buildingsData
              .filter(
                (b) =>
                  searchRegex.test(b.Name.toLowerCase()) ||
                  searchRegex.test(b.Area.toLowerCase()),
              )
              .slice(0, 10);

            if (filtered.length === 0 || normalizedValue === "") {
              this.ui.dropdownMenu.classList.remove("show");
              this.ui.searchHint.textContent = "";
              this.state.activeAutofillValue = "";
              return;
            }

            filtered.forEach((item) => {
              const row = document.createElement("div");
              row.className = "dropdown-item";
              const statusClass = item.Status.toLowerCase().replace(
                /\s+/g,
                "-",
              );

              row.innerHTML = `<div class="item-info">
                  <div class="item-name">${item.Name}</div>
                  <div class="item-area">${item.Area}</div>
                </div>
                <div class="status-badge ${statusClass}">${item.Status}</div>`;

              row.addEventListener("click", () =>
                this.handleLocationSelect(item),
              );
              this.ui.dropdownMenu.appendChild(row);
            });

            this.ui.dropdownMenu.classList.add("show");
            const match = filtered[0];
            if (match.Name.toLowerCase().startsWith(normalizedValue)) {
              this.ui.searchHint.textContent =
                this.ui.searchInput.value +
                match.Name.slice(normalizedValue.length);
              this.state.activeAutofillValue = match.Name;
            } else {
              this.ui.searchHint.textContent = "";
              this.state.activeAutofillValue = "";
            }
          }
        }

        handleLocationSelect(item) {
          this.state.isSelection = true;
          this.ui.searchInput.input.blur();
          this.ui.searchInput.disabled = true;
          this.ui.searchInput.value = item.Name;
          this.ui.confirmBtn.classList.add("show");
          this.telegram.hideKeyboard();

          const targetLatLng = [item.Latitude, item.Longitude];
          this.map.setView(targetLatLng, this.config.maxZoom);
          this.setPin(targetLatLng);
          this.resetSearchUI();
        }

        expandTelegram() {
          if (window.Telegram?.WebApp) {
            this.telegram = window.Telegram.WebApp;
            this.telegram.expand();
            this.telegram.disableVerticalSwipes();
          }
        }
      }
      document.addEventListener("DOMContentLoaded", () => {
        const app = new MapApp();
        app.init();
      });
    </script>
  </body>
</html>
